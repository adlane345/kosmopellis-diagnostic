:root{
  --canvas:#FAF8F4;--paper:#FFFFFF;--ink:#23211E;--ink-2:#5E5A54;--ink-3:#8F8981;--line:#E8E3DA;--line-2:#F1EDE6;
  --copper:#8A3A1E;--copper-deep:#6A2912;--champagne:#D8C7AD;--taupe:#B5A99A;
  --antiage:#C7B393;--eyes:#7E6594;--lips:#C24A4A;
  --s0:#DAD6CF;--s1:#B8B2A8;--s2:#8C867E;--s3:#5A5650;--s4:#23211E;
  --ok:#5E7F5A;--warn:#B98A2E;--fail:#A6402E;
  --display:'Halogen Flare','Jost','Futura','Helvetica Neue',sans-serif;
  --body:'Helvetica Neue',Helvetica,Arial,'Inter',system-ui,sans-serif;
  --r:18px;--shadow:0 1px 2px rgba(35,33,30,.04),0 12px 40px -18px rgba(35,33,30,.18);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--copper);outline-offset:3px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header.top{position:sticky;top:0;z-index:30;background:rgba(250,248,244,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line-2)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:62px;gap:12px}
.logo{font-family:var(--display);letter-spacing:.32em;font-size:15px;font-weight:500;color:var(--ink);text-decoration:none;white-space:nowrap}
.logo small{display:block;font-family:var(--body);letter-spacing:.28em;font-size:8.5px;color:var(--ink-3);margin-top:2px}
.nav{display:flex;align-items:center;gap:6px}
.chipbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:12px;letter-spacing:.08em}
.chipbtn[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--copper);font-weight:600}
h1,h2,h3{font-family:var(--display);font-weight:500;letter-spacing:.04em;margin:0}
h1{font-size:clamp(34px,6vw,62px);line-height:1.04;letter-spacing:.01em}
h2{font-size:clamp(24px,3.6vw,34px);line-height:1.12}
h3{font-size:18px;letter-spacing:.06em}
p{margin:0}
.lede{color:var(--ink-2);font-size:clamp(16px,2vw,19px);max-width:620px}
.muted{color:var(--ink-3)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;padding:16px 28px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;background:var(--ink);color:#fff;transition:transform .2s,background .2s,opacity .2s;text-decoration:none}
.btn:hover{background:var(--copper-deep)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.copper{background:var(--copper)}
.btn.sm{padding:11px 18px;font-size:11px}
.link{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;color:var(--ink-2);font-size:14px}
.card{background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow)}
.screen{display:none;animation:fade .5s ease both}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.steps{display:flex;gap:6px;justify-content:center;padding:18px 0 4px}
.steps span{height:3px;width:42px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--copper)}
/* HERO */
.hero{padding:56px 0 40px;display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.hero .visual{position:relative;aspect-ratio:1024/1150;border-radius:28px;overflow:hidden;background:radial-gradient(120% 90% at 30% 20%,#fff 0%,#F3EEE6 55%,#E9E1D5 100%)}
.hero .visual svg{position:absolute;inset:0;width:100%;height:100%;direction:ltr}
.hero .visual .heroimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%}
.hero .visual text{font-family:var(--body)}
.hz{animation:hz .8s ease both}.hz:nth-child(2){animation-delay:.15s}.hz:nth-child(3){animation-delay:.3s}
@keyframes hz{from{opacity:0}to{opacity:1}}
.trust{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;color:var(--ink-2);font-size:13px}
.trust span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--copper);margin-inline-end:8px;vertical-align:middle}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0 56px}
.how .card{padding:26px}
.how b{font-family:var(--display);font-size:13px;letter-spacing:.24em;color:var(--copper)}
.how h3{margin:10px 0 6px}
.promise{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:64px}
.promise .card{padding:28px}
.promise ul{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:9px;font-size:15px;color:var(--ink-2)}
.promise li{display:flex;gap:10px}
.promise li i{font-style:normal;color:var(--copper);font-weight:700}
.promise .no li i{color:var(--ink-3)}
/* FORM */
.formcard{max-width:640px;margin:28px auto 64px;padding:34px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label.f{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
input[type=text],input[type=email],input[type=tel],input[type=number],select{width:100%;padding:14px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--copper)}
.err{color:var(--fail);font-size:12px;min-height:16px;margin-top:4px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line-2);font-size:14px;color:var(--ink-2)}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--copper);flex:none}
.check b{color:var(--ink);font-weight:600}
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.tog{border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:13px;background:#fff}
.tog[aria-pressed=true]{border-color:var(--copper);background:#F7EEE9;color:var(--copper-deep)}
/* CAPTURE */
.capture{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;margin:24px 0 64px;align-items:start}
.stage{position:relative;aspect-ratio:3/4;border-radius:26px;overflow:hidden;background:#1d1b19}
.stage video,.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage video{transform:scaleX(-1)}
.stage canvas.hud{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.stage .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#d9d2c8;gap:14px;text-align:center;padding:24px}
.stage .oval{position:absolute;left:50%;top:47%;width:58%;height:64%;transform:translate(-50%,-50%);border-radius:50%;border:1.5px dashed rgba(255,255,255,.55);pointer-events:none;transition:border-color .3s}
.stage .oval.good{border:2px solid #E8D7BC}
.stage .hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;color:#fff;font-size:14px;letter-spacing:.04em;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.coach{padding:24px}
.chk{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.chk:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.pass{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.fail{background:var(--fail)}
.chk span.v{color:var(--ink-3);font-size:12px;margin-inline-start:auto;margin-inline-end:10px}
.or{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
/* SELF */
.selfgrid{display:grid;gap:14px;max-width:680px;margin:22px auto}
.selfrow{padding:20px 22px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.scale button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;font-size:12px;line-height:1.25}
.scale button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
/* ANALYZING */
.analyzing{max-width:520px;margin:60px auto;text-align:center}
.analyzing ol{list-style:none;padding:0;margin:30px 0 0;text-align:start;display:grid;gap:12px}
.analyzing li{display:flex;gap:12px;align-items:center;color:var(--ink-3);font-size:15px}
.analyzing li.done{color:var(--ink)}
.analyzing li.cur{color:var(--copper)}
.analyzing li i{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;flex:none;display:grid;place-items:center;font-style:normal;font-size:11px}
.analyzing li.done i{background:var(--ink);color:#fff;border-color:var(--ink)}
.analyzing li.cur i{border-top-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* RESULTS */
.res-head{padding:40px 0 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.cert{display:flex;align-items:center;gap:16px;padding:16px 20px}
.grade{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:20px;border:1.5px solid var(--copper);color:var(--copper)}
.res-main{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.faceframe{position:relative;border-radius:26px;overflow:hidden;background:#eee}
.faceframe img{display:block;width:100%;height:auto}
.faceframe svg{position:absolute;inset:0;width:100%;height:100%}
.viewtabs{display:flex;gap:6px;margin:12px 0}
.zone-dot{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px;vertical-align:-1px}
.zlist{display:grid;gap:10px}
.zrow{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:16px 18px;border-radius:16px;background:var(--paper);border:1px solid var(--line-2);cursor:pointer;transition:border-color .2s,box-shadow .2s}
.zrow:hover,.zrow.sel{border-color:var(--champagne);box-shadow:var(--shadow)}
.zrow .nm{font-weight:600;font-size:15px}
.zrow .fam{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.sevbar{display:flex;gap:3px;align-items:center}
.sevbar b{width:18px;height:6px;border-radius:3px;background:var(--line)}
.sevlab{font-size:12px;color:var(--ink-2);text-align:end;min-width:96px}
.conf{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-3)}
.conf .bar{flex:1;height:3px;border-radius:2px;background:var(--line-2);overflow:hidden;max-width:160px}
.conf .bar i{display:block;height:100%;background:var(--taupe)}
.zdetail{grid-column:1/-1;display:none;font-size:14px;color:var(--ink-2);padding-top:8px;border-top:1px dashed var(--line);margin-top:6px}
.zrow.sel .zdetail{display:block}
.na{font-style:italic;color:var(--ink-3)}
.strengths{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.strengths span{padding:8px 14px;border-radius:999px;background:#F2F0EA;font-size:13px;color:var(--ink-2)}
section.block{margin:56px 0}
section.block > .eyebrow{display:block;margin-bottom:10px}
.protos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:20px}
.proto{padding:24px;position:relative;overflow:hidden}
.proto::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--fc)}
[dir=rtl] .proto::before{inset:0 0 0 auto}
.proto .pn{font-family:var(--display);font-size:20px;letter-spacing:.04em;margin:6px 0 2px}
.proto dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:16px 0 0;font-size:14px}
.proto dt{color:var(--ink-3)}
.proto dd{margin:0;text-align:end}
.pack{margin-top:14px;padding:12px 14px;background:var(--canvas);border-radius:12px;font-size:13px}
.pack b{font-weight:600}
.pack .why{color:var(--ink-3);margin-top:4px}
.prodimg{width:64px;height:64px;object-fit:contain;border-radius:12px;background:var(--canvas);float:inline-end;margin-inline-start:10px}
table.cal{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:14px;margin-top:16px}
table.cal th{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:500;text-align:center;padding:4px}
table.cal td{text-align:center;background:var(--paper);padding:10px 4px;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}
table.cal td:first-child{border-inline-start:1px solid var(--line-2);border-start-start-radius:12px;border-end-start-radius:12px;color:var(--ink-3);font-size:12px}
table.cal td:last-child{border-inline-end:1px solid var(--line-2);border-start-end-radius:12px;border-end-end-radius:12px}
.pill{display:inline-block;min-width:30px;padding:3px 8px;border-radius:999px;color:#fff;font-size:12px;font-weight:600}
.offer{padding:30px;display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:center;background:linear-gradient(135deg,#fff 0%,#F6F0E8 100%)}
.price{font-family:var(--display);font-size:clamp(28px,7vw,38px);letter-spacing:.02em;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.price s{font-size:18px;color:var(--ink-3)}
.lines{font-size:14px;color:var(--ink-2);display:grid;gap:4px;margin-top:10px}
.lines div{display:flex;justify-content:space-between;gap:12px}
.offer>*,.res-main>*,.jgrid>*,.capture>*,.hero>*{min-width:0}
.lines div span:first-child{min-width:0;overflow-wrap:anywhere}
.cta{display:flex;flex-direction:column;gap:10px}
.evidence{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:18px}
.ev{padding:22px}
.ev .stat{font-family:var(--display);font-size:24px;white-space:nowrap;color:var(--copper)}
.ev ul{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:10px}
.ev li{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:baseline;font-size:13.5px;color:var(--ink-2)}
.ev .src{font-size:11.5px;color:var(--ink-3);margin-top:12px}
.gap{padding:22px;display:grid;gap:12px}
.gaprow{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:center;font-size:14px}
.gaptrack{position:relative;height:26px;border-radius:13px;background:var(--line-2)}
.gaptrack i{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);font-style:normal}
.gaptrack i.m{background:var(--ink)}.gaptrack i.s{background:#fff;border:2px solid var(--copper)}
.disc{font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);padding:22px 0 60px;margin-top:40px}

.guide{position:absolute;left:12px;right:12px;top:12px;background:rgba(28,26,24,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:18px;padding:12px 16px 14px;color:#fff;text-align:center;z-index:3}
.gstep{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#E8D7BC}
.gmain{display:flex;align-items:center;justify-content:center;gap:12px;font-size:19px;font-weight:600;margin-top:6px;line-height:1.25;min-height:48px}
.gicon{font-size:30px;line-height:1;display:inline-block;animation:nudge 1.1s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(var(--nx,0)) translateY(var(--ny,0))}}
.gbar{height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin-top:10px;overflow:hidden}.gbar i{display:block;height:100%;width:0;background:#E8D7BC;transition:width .25s}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4;transition:opacity .25s}.flash.on{opacity:.55;transition:none}
.stage .hint{bottom:18px;font-size:15px;padding:0 16px}
.intro{position:absolute;inset:0;z-index:5;background:rgba(20,18,17,.82);display:flex;align-items:center;justify-content:center;padding:18px}
.introcard{max-width:360px;width:100%}
.insteps{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.insteps li{display:flex;gap:12px;align-items:flex-start;color:#fff}
.insteps b{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid #E8D7BC;color:#E8D7BC;display:grid;place-items:center;font-size:13px}
.insteps strong{display:block;font-size:15px}.insteps em{display:block;font-style:normal;color:#CFC8BD;font-size:13px;margin-top:2px}
.intips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}.intips span{font-size:12px;color:#EDE4D6;border:1px solid rgba(232,215,188,.4);border-radius:999px;padding:5px 10px}
@media (max-width:860px){.capture .stage{aspect-ratio:auto;height:78vh;max-height:720px}}
.hdcard{margin-top:16px;padding:16px;border-radius:14px;background:#F7EEE9;border:1px solid #EAD9CD}.hdcard b{color:var(--copper-deep)}.hdcard p{margin-top:4px;color:var(--ink-2)}
/* JOURNAL */
.jgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0}
.jcard{padding:24px}
.adh{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:12px}
.adh button{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:10px;color:var(--ink-3)}
.adh button[aria-pressed=true]{background:var(--fc,var(--ink));border-color:var(--fc,var(--ink));color:#fff}
.meter{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:var(--copper)}
.hist{width:100%;font-size:13px;border-collapse:collapse;margin-top:10px}
.hist td,.hist th{padding:8px 6px;border-bottom:1px solid var(--line-2);text-align:start}
.hist th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.cmp{padding:14px 16px;border-radius:12px;background:var(--canvas);font-size:14px;margin-top:10px}
.cmp.blocked{background:#FBF3EE;color:var(--copper-deep)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;z-index:80;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.demo-banner{background:#2E2A26;color:#EDE4D6;font-size:12px;text-align:center;padding:7px 12px;letter-spacing:.04em}
/* print booklet */
@media print{
  header.top,.nav,.btn,.viewtabs,#scr-journal,.demo-banner,.cta,.steps{display:none!important}
  body{background:#fff}
  .screen{display:none!important}#scr-results{display:block!important}
  .card{box-shadow:none}
}
@media (max-width:520px){header.top .wrap{padding:0 12px;gap:6px}.logo{font-size:12px;letter-spacing:.2em}.logo small{font-size:7px;letter-spacing:.2em}.nav{gap:3px}.chipbtn{padding:6px 8px;font-size:11px;letter-spacing:.02em}}
@media (max-width:860px){
  .hero,.capture,.res-main,.offer,.jgrid,.promise{grid-template-columns:1fr}
  .hero{padding-top:30px;gap:28px}
  .hero .visual{max-height:420px}
  .how{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .formcard{padding:24px}
  .gaprow{grid-template-columns:1fr}
}
</style>
</head>

const sharpC=document.createElement("canvas");
function frameSharp(p){   // Laplacian variance on the eye/cheek band at native video resolution
  const vw=video.videoWidth, vh=video.videoHeight, iod=Math.abs(p.pupL.x-p.pupR.x)*vw;
  const x0=Math.max(0,Math.min(p.pupR.x,p.pupL.x)*vw-0.5*iod), y0=Math.max(0,((p.pupR.y+p.pupL.y)/2)*vh-0.25*iod);
  const w=Math.min(vw-x0,2*iod), h=Math.min(vh-y0,1.1*iod); if(w<20||h<20) return 0;
  const sc=Math.min(1,320/w); sharpC.width=Math.round(w*sc); sharpC.height=Math.round(h*sc);
  const x=sharpC.getContext("2d",{willReadFrequently:true}); x.drawImage(video,x0,y0,w,h,0,0,sharpC.width,sharpC.height);
  const d=x.getImageData(0,0,sharpC.width,sharpC.height).data, W=sharpC.width, H=sharpC.height, g=new Float32Array(W*H);
  for(let i=0,j=0;j<g.length;i+=4,j++) g[j]=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
  let s=0,s2=0,n=0; for(let yy=1;yy<H-1;yy++) for(let xx=1;xx<W-1;xx++){ const q=yy*W+xx, l=4*g[q]-g[q-1]-g[q+1]-g[q-W]-g[q+W]; s+=l; s2+=l*l; n++; }
  return n? (s2/n-(s/n)*(s/n)) : 0;
}

async function fileToPhoto(f){
    let blob=f;
    if(/hei[cf]/i.test(f.type)||/\.hei[cf]$/i.test(f.name)){
      try{ const bm=await createImageBitmap(f); bm.close(); }  // Safari decodes HEIC natively
      catch(_){ await loadScript("https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"); try{ blob=await window.heic2any({blob:f,toType:"image/jpeg",quality:0.92}); if(Array.isArray(blob)) blob=blob[0]; }catch(err){ toast(t("heicErr")); return null; } }
    }
    let bmp; try{ bmp=await createImageBitmap(blob,{imageOrientation:"from-image"}); }catch(_){ bmp=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(blob);}); }
    const w=bmp.width,h=bmp.height,sc=Math.min(1,MAXDIM/Math.max(w,h));
    const c=document.createElement("canvas");c.width=Math.round(w*sc);c.height=Math.round(h*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);       // re-encode = EXIF/GPS metadata stripped
    let q=0.93,url=c.toDataURL("image/jpeg",q); while(url.length>3.2e6&&q>0.7){q-=0.06;url=c.toDataURL("image/jpeg",q);}  // adaptive compression
    return {url,w:c.width,h:c.height};
}

function familySeverity(r,fam){
  const zs=r.zones.filter(z=>CONFIG.zoneFamily[z.key]===fam);
  const assessed=zs.filter(z=>z.status==="assessed"&&z.severity!=null);
  if(assessed.length) return {sev:Math.max(...assessed.map(z=>z.severity)),source:"measured",drivers:assessed.filter(z=>z.severity>=1).sort((a,b)=>b.severity-a.severity).map(z=>z.key)};
  if(S.self[fam]!=null) return {sev:S.self[fam],source:"self",drivers:[]};
  return {sev:null,source:"none",drivers:[]};
}
function optimizePacks(fam,need){
  const P=CONFIG.packs[fam], keys=["cure2","cure1","box"]; let best=null;
  for(let a=0;a<=4;a++)for(let b=0;b<=4;b++)for(let c=0;c<=8;c++){
    const have=a*P.cure2.sachets+b*P.cure1.sachets+c*P.box.sachets; if(have<need) continue;
    const cost=+(a*P.cure2.price+b*P.cure1.price+c*P.box.price).toFixed(2), sur=have-need;
    if(!best||cost<best.cost-0.001||(Math.abs(cost-best.cost)<0.001&&sur<best.surplus)) best={cost,surplus:sur,have,items:[["cure2",a],["cure1",b],["box",c]].filter(x=>x[1]>0)};
  }
  return best;
}
function buildPlan(r){
  const fams={}; let maxSev=0;

    const fs=familySeverity(r,f); const rule=fs.sev>=1?CONFIG.protocols[fs.sev]:null;
    if(!rule){fams[f]={...fs,active:false};return;}
    const apps=rule.perWeek.reduce((a,b)=>a+b,0), need=apps*CONFIG.sachetsPerApplication[f];
    fams[f]={...fs,active:true,rule,weeks:rule.perWeek.length,apps,need,packs:optimizePacks(f,need)};
    if(fs.sev>maxSev) maxSev=fs.sev;
  });
  const pct=CONFIG.discounts[maxSev]||0;
  const subtotal=FAMS.reduce((s,f)=>s+(fams[f].active?fams[f].packs.cost:0),0);
  const start=nextMonday();
  return {fams,maxSev,pct,code:pct?("PROTOCOLE"+pct):null,subtotal,discountAmt:subtotal*pct/100,total:subtotal*(1-pct/100),start,created:new Date().toISOString()};
}

function comparability(a,b){
  const C=CONFIG.comparability, R=[];
  if(a.engine!==b.engine) R.push("r_engine");
  if(!C.minGrade.includes(a.capture.grade)||!C.minGrade.includes(b.capture.grade)) R.push("r_grade");
  if(Math.abs(a.capture.yaw-b.capture.yaw)>C.maxYawDiff) R.push("r_yaw");
  if(Math.abs(a.capture.roll-b.capture.roll)>C.maxRollDiff) R.push("r_roll");
  const ir=b.capture.iodPx/Math.max(1,a.capture.iodPx); if(ir<C.iodRatio[0]||ir>C.iodRatio[1]) R.push("r_iod");
  if(Math.abs(a.capture.lum-b.capture.lum)/Math.max(1,a.capture.lum)>C.maxLumDiff) R.push("r_lum");
  if(Math.abs(a.capture.asym-b.capture.asym)>C.maxAsymDiff) R.push("r_asym");
  return R;
}

  el.querySelectorAll("[data-adh]").forEach(b=>b.addEventListener("click",()=>{const jj=Journal.load();jj.adh[b.dataset.adh]=!jj.adh[b.dataset.adh];Journal.save(jj);renderJournal();}));
  el.querySelectorAll("[data-stock]").forEach(i=>i.addEventListener("change",()=>{const jj=Journal.load();const v=i.value===""?undefined:Math.max(0,parseInt(i.value,10)||0);if(v==null)delete jj.stock[i.dataset.stock];else jj.stock[i.dataset.stock]=v;Journal.save(jj);setTimeout(renderJournal,0);}));
  document.getElementById("jDel").addEventListener("click",()=>{try{localStorage.removeItem(Journal.KEY);}catch(e){} toast(t("jDeleted")); renderJournal();});
  document.getElementById("jRescan").addEventListener("click",()=>go(S.lead?"capture":"profile"));
}

/* =====================================================================
   COLLECT — consented, photo-free record to a backend (if configured)
   ===================================================================== */
function collect(event){
  if(!CONFIG.collectUrl||!S.lead||!S.result) return;
  const rec={event:event||"diagnostic.completed",ts:new Date().toISOString(),app:CONFIG.appVersion,engine:S.result.engine,
    lead:{name:S.lead.name,email:S.lead.email,phone:S.lead.phone,age:S.lead.age,country:S.lead.country,lang:LANG,consents:S.lead.consents},
    capture:S.result.capture.checks, zones:S.result.zones.map(z=>({key:z.key,severity:z.severity,status:z.status,confidence:z.confidence,metric:z.metric??null})),
    self:S.self, plan:{pct:S.plan.pct,code:S.plan.code,subtotal:S.plan.subtotal,fams:Object.fromEntries(FAMS.map(f=>[f,S.plan.fams[f].active?{sev:S.plan.fams[f].sev,source:S.plan.fams[f].source,need:S.plan.fams[f].need,packs:S.plan.fams[f].packs.items}:null]))}};
  try{fetch(CONFIG.collectUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(rec),keepalive:true});}catch(e){}
}

/* init */
(function(){
  let l="fr"; try{l=localStorage.getItem("kp_lang")||(navigator.language||"fr").slice(0,2);}catch(e){}
  applyLang(["fr","en","ar"].includes(l)?l:"fr");
  if(!CONFIG.pricesAreLive){const b=document.getElementById("demoBanner");b.hidden=false;b.textContent="Préversion v3 — prix catalogue indicatifs, seuils de mesure en calibration · Preview v3 — indicative prices, thresholds under calibration";}
})();
</script>
